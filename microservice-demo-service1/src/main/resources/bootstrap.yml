server:
  port: 8083

spring:
  application:
    name: microservice-demo-service1
  config:
    import:
      - optional:file:./files/config/common.yml
      - nacos:common.yml?refreshEnabled=true
      - nacos:common-business.yml?refreshEnabled=true
      - nacos:${spring.application.name}.yml?refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${microservice-demo.nacos.server}
      username: ${microservice-demo.nacos.username}
      password: ${microservice-demo.nacos.password}
      discovery:
        namespace: ${microservice-demo.nacos.namespace}
      config:
        namespace: ${microservice-demo.nacos.namespace}
