server:
  port: 8080

spring:
  application:
    name: microservice-demo-gateway
  config:
    import:
      - optional:file:./files/config/common.yml
      - classpath:config/routes.yml
      - classpath:config/authorities.yml
      - nacos:common.yml?refreshEnabled=true
      - nacos:${spring.application.name}.yml?refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${microservice-demo.nacos.server}
      username: ${microservice-demo.nacos.username}
      password: ${microservice-demo.nacos.password}
      discovery:
        namespace: ${microservice-demo.nacos.namespace}
      config:
        namespace: ${microservice-demo.nacos.namespace}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${microservice-demo.auth.jwt.issuer-uri}
          jwk-set-uri: ${microservice-demo.auth.jwt.jwk-set-uri}

honoka:
  webflux:
    enabled: true
    gateway:
      enabled: true
