server:
  port: 8082

spring:
  application:
    name: microservice-demo-user
  config:
    import:
      - optional:file:./files/config/common.yml
      - nacos:common.yml?refreshEnabled=true
      - nacos:common-business.yml?refreshEnabled=true
      - nacos:${spring.application.name}.yml?refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${app.nacos.server}
      username: ${app.nacos.username}
      password: ${app.nacos.password}
      discovery:
        namespace: ${app.nacos.namespace}
      config:
        namespace: ${app.nacos.namespace}
