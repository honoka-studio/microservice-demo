[versions]
# project modules version
p-root = "1.0.0-dev"

# gradle plugins version
gp-honoka-basic = "1.0.4-dev"

# dependencies version
d-kotlin = "2.2.0"
d-kotlin-coroutines = "1.10.2"
d-spring-boot = "3.5.9"
d-spring-cloud = "2025.0.1"
d-spring-cloud-alibaba = "2025.0.0.0"
d-mybatis-plus = "3.5.16"
d-honoka-spring-boot-starter = "1.0.5-dev"

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "d-kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "d-kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "d-kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "d-spring-boot" }
honoka-basic = { id = "de.honoka.gradle.plugin.basic", version.ref = "gp-honoka-basic" }

[libraries]
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "d-spring-cloud" }
spring-cloud-alibaba-bom = { module = "com.alibaba.cloud:spring-cloud-alibaba-dependencies", version.ref = "d-spring-cloud-alibaba" }
mybatis-plus = { module = "com.baomidou:mybatis-plus-spring-boot3-starter", version.ref = "d-mybatis-plus" }
mybatis-plus-jsqlparser = { module = "com.baomidou:mybatis-plus-jsqlparser", version.ref = "d-mybatis-plus" }
honoka-spring-boot-starter = { module = "de.honoka.sdk:honoka-spring-boot-starter", version.ref = "d-honoka-spring-boot-starter" }
